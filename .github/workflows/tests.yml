name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # Arch, like the machines A2Qlinux runs on: the same clang, lld and Wine
    # headers bridge/build.sh uses locally (Wine is in Arch's `extra`).
    container: archlinux:latest
    steps:
      - name: Install tools
        # git before checkout: without it actions/checkout downloads a tarball
        # with no history, and hatch-vcs cannot derive the version from tags.
        run: pacman -Syu --noconfirm --needed git clang lld wine python python-pyqt6 p7zip

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout (owned by another user in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the Windows parts
        run: bash bridge/build.sh

      - name: Run tests
        run: python -m unittest -v
